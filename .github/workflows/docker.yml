name: Docker Build & Push

on:
  push:
    tags: ['v*']
  # Rebuilding a published image used to mean force-pushing its tag. Dispatching
  # against the tag ref cannot work either: workflow_dispatch reads the workflow
  # definition from the chosen ref, and already-released tags predate this
  # trigger. So the tag arrives as an input and the job checks it out itself.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild (e.g. v0.9.9)'
        required: true

concurrency:
  group: docker-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Pin the input into the tags namespace. A bare `${{ inputs.tag }}`
          # resolves any ref, so a branch named v0.9.9 could overwrite the
          # published v0.9.9 image with non-release code. An explicit
          # refs/tags/… fails the checkout outright when no such tag exists,
          # which is the validation.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=${{ github.event_name == 'workflow_dispatch' && 'false' || 'auto' }}
          # A dispatched run sits on the default branch, so github.ref carries no
          # version for type=semver to read. Name the source explicitly.
          #
          # The floating tags are pushed only by a real tag push. A rebuild of an
          # older release must not move {{major}} or {{major}}.{{minor}} back onto
          # it — anything deployed from `:0` would silently roll back.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},enable=${{ github.event_name != 'workflow_dispatch' }}
            type=semver,pattern={{major}},value=${{ github.ref_name }},enable=${{ github.event_name != 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
